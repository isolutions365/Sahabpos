<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="12" opacity="0.4" />

  <!-- Shopping Trolley / Basket Graphic -->
  <g transform="translate(256 256) scale(1.08) translate(-256 -256)">
    <!-- Cart / Trolley Body -->
    <path d="M 110 150 L 155 150 L 190 325 L 380 325 L 415 190 L 165 190" 
          fill="none" stroke="url(#basketGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Basket Grid Lines -->
    <line x1="200" y1="235" x2="398" y2="235" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round" />
    <line x1="215" y1="280" x2="385" y2="280" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round" />
    <line x1="250" y1="190" x2="265" y2="325" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round" />
    <line x1="320" y1="190" x2="325" y2="325" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round" />

    <!-- Trolley Wheels -->
    <circle cx="215" cy="385" r="28" fill="#ffffff" />
    <circle cx="215" cy="385" r="12" fill="#312e81" />
    
    <circle cx="355" cy="385" r="28" fill="#ffffff" />
    <circle cx="355" cy="385" r="12" fill="#312e81" />

    <!-- Active Checkmark Badge -->
    <circle cx="365" cy="140" r="32" fill="#10b981" />
    <path d="M 353 140 L 361 148 L 377 132" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
